<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贝尔安亲作业反馈系统 - 加密访问系统</title>
   <!-- 或者使用本地样式（推荐） -->
<style>
/* 粘贴完整的样式代码 */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* ... 将之前style.css的全部内容复制到这里 ... */
</style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div id="auth-screen" class="screen">
            <div class="logo">
                <i class="fas fa-lock"></i>
                <h1>贝尔安亲作业反馈系统 - 安全访问</h1>
            </div>
            
            <div class="auth-box">
                <div class="qr-overlay">
                    <i class="fas fa-qrcode"></i>
                    <p>请使用本月有效二维码扫描访问贝尔安亲作业反馈系统</p>
                </div>
                
                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <p>验证中...</p>
                </div>
                
                <div id="content" class="content hidden">
                    <!-- 这里放置你的实际内容 -->
                    <h2>欢迎访问贝尔安亲作业反馈系统</h2>
                    <div class="info-card">
                        <h3><i class="fas fa-calendar-check"></i> 本月有效</h3>
                        <p>当前访问时间: <span id="current-date"></span></p>
                        <p>有效期至: <span id="expiry-date"></span></p>
                    </div>
                    
                    <div class="features">
                        <div class="feature">
                            <i class="fas fa-shield-alt"></i>
                            <h4>安全加密</h4>
                            <p>每月动态更新访问凭证</p>
                        </div>
                        <div class="feature">
                            <i class="fas fa-mobile-alt"></i>
                            <h4>移动优化</h4>
                            <p>完美适配手机端访问</p>
                        </div>
                        <div class="feature">
                            <i class="fas fa-sync-alt"></i>
                            <h4>自动更新</h4>
                            <p>每月自动更换安全密钥</p>
                        </div>
                    </div>
                    
                    <div class="actions">
                        <!-- 重要：修改这里为你第二个应用的实际文件 -->
                        <!-- 进入系统按钮 - 默认隐藏 -->
<button id="enterSystemBtn" onclick="window.open('贝尔安亲作业反馈系统.html', '_blank')" class="btn-primary" style="display: none;">
    <i class="fas fa-external-link-alt"></i> 进入贝尔安亲作业反馈系统
</button>
                        <button onclick="location.reload()" class="btn-secondary">
                            <i class="fas fa-redo"></i> 重新验证
                        </button>
                    </div>
                </div>
                
                <div id="error" class="error hidden">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3>访问被拒绝</h3>
                    <p id="error-message"></p>
                    <button onclick="location.reload()" class="btn-retry">
                        <i class="fas fa-redo"></i> 重试
                    </button>
                </div>
            </div>
            
            <div class="footer">
                <p><i class="fas fa-info-circle"></i> 如需获取第二个应用二维码，请联系系统管理员</p>
                <p class="version">v1.0 | 有效期: <span id="token-month"></span></p>
            </div>
        </div>
    </div>
    
    <!-- 注意：这里引用app2目录下的auth.js，而不是根目录的 -->
    <script>
// 页面加载后直接执行
(function() {
    const loading = document.getElementById('loading');
    const content = document.getElementById('content');
    const error = document.getElementById('error');
    const errorMsg = document.getElementById('error-message');
    const btn = document.getElementById('enterSystemBtn');
    
    const urlToken = new URLSearchParams(location.search).get('token');
    console.log('URL令牌:', urlToken);
    
    fetch('config.json')
        .then(r => r.json())
        .then(config => {
            const now = new Date();
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const correctToken = config.tokens[month];
            console.log('当前月份:', month, '正确令牌:', correctToken);
            
            if (urlToken && urlToken === correctToken) {
                // 验证成功
                loading.classList.add('hidden');
                content.classList.remove('hidden');
                error.classList.add('hidden');
                
                // 更新有效期
                const expiryDate = new Date(now.getFullYear(), parseInt(month), 0);
                document.getElementById('expiry-date').textContent = 
                    expiryDate.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
                document.getElementById('token-month').textContent = 
                    expiryDate.toLocaleDateString('zh-CN', { month: 'long', year: 'numeric' });
                document.getElementById('current-date').textContent = 
                    now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                
                if (btn) btn.style.display = 'inline-block';
                console.log('验证成功！');
            } else {
                throw new Error('无效的访问令牌');
            }
        })
        .catch(err => {
            loading.classList.add('hidden');
            content.classList.add('hidden');
            error.classList.remove('hidden');
            errorMsg.textContent = err.message || '系统配置加载失败';
            console.error('错误:', err);
        });
})();

// 日期更新功能
setInterval(() => {
    const el = document.getElementById('current-date');
    if (el) {
        el.textContent = new Date().toLocaleDateString('zh-CN', {
            year: 'numeric', month: 'long', day: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
    }
}, 60000);

// 按钮特效（可选）
document.querySelectorAll('button').forEach(button => {
    button.addEventListener('click', function(e) {
        const ripple = document.createElement('span');
        const rect = this.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = e.clientX - rect.left - size / 2;
        const y = e.clientY - rect.top - size / 2;
        
        ripple.style.cssText = `
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.7);
            transform: scale(0);
            animation: ripple 0.6s linear;
            width: ${size}px;
            height: ${size}px;
            left: ${x}px;
            top: ${y}px;
        `;
        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    });
});

// 添加CSS动画
const style = document.createElement('style');
style.textContent = `
    @keyframes ripple {
        to { transform: scale(4); opacity: 0; }
    }
`;
document.head.appendChild(style);
</script>
</body>
</html>
